name: errs

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-errs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-errs}
      POSTGRES_DB: ${POSTGRES_DB:-errs}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-errs}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - errs-network

  api:
    build:
      context: ./apps/api
      target: development
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-errs}:${POSTGRES_PASSWORD:-errs}@postgres:5432/${POSTGRES_DB:-errs}
    ports:
      - "8000:8000"
    volumes:
      # Mount only the source subtrees that need host-edit hot-reload —
      # deliberately NOT the whole ./apps/api root. That root also holds
      # apps/api/.env (DATABASE_URL=...@localhost..., for running the API
      # outside Docker) and a local .venv/. Bind-mounting the whole
      # directory would smuggle both into the container: pydantic-settings'
      # env_file=".env" would then read the host .env as a config source,
      # and it would only lose to the DATABASE_URL set below because two
      # separate, implicit precedence rules both happen to hold (Compose
      # `environment:` over `env_file:`, and pydantic-settings' real env
      # vars over dotenv-file values). Relying on that is exactly what
      # silently breaks DNS resolution of the `postgres` host the moment
      # either rule changes — mounting only these subpaths removes the
      # host .env from the container filesystem entirely, so there is no
      # second source to race against.
      - ./apps/api/app:/app/app
      - ./apps/api/alembic:/app/alembic
      - ./apps/api/tests:/app/tests
      - ./apps/api/alembic.ini:/app/alembic.ini
      - ./apps/api/pyproject.toml:/app/pyproject.toml
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - errs-network

  frontend:
    build:
      context: ./apps/frontend
      target: development
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - api
    networks:
      - errs-network

networks:
  errs-network:
    driver: bridge

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next_cache:
